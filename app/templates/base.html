<!DOCTYPE html>
<html lang="ru">
<head>
    <link
    rel="icon"
    href="{{ url_for('static', filename='images/favicon.png') }}"
    type="image/png"
    >
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}PestWatch{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>

<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a
                class="brand"
                href="{{ url_for('index') }}"
            >
                PestWatch
            </a>

            <nav
                class="main-nav"
                aria-label="Основная навигация"
            >
                <a
                    class="main-nav__link"
                    href="{{ url_for('index') }}"
                >
                    Оценка риска
                </a>

                <a
                    class="main-nav__link"
                    href="{{
                        url_for(
                            'assessment_history_web.get_assessment_history'
                        )
                    }}"
                >
                    История
                </a>

                <a
                    class="main-nav__link"
                    href="{{
                        url_for(
                            'threat_web.get_threat_catalog'
                        )
                    }}"
                >
                    Каталог угроз
                </a>
            </nav>
        </div>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>
    <script>
(function () {
    const DEMO_MODE_STORAGE_KEY =
        "pestwatch.demoMode";

    function isDemoMode() {
        return (
            window.sessionStorage.getItem(
                DEMO_MODE_STORAGE_KEY
            ) === "true"
        );
    }

    const assessmentLinks =
        document.querySelectorAll(
            'a[href="/"]'
        );

    assessmentLinks.forEach(function (link) {
        link.addEventListener(
            "click",
            function (event) {
                if (!isDemoMode()) {
                    return;
                }

                event.preventDefault();
                window.location.href =
                    "/?demo=1";
            }
        );
    });
})();
</script>
</body>
</html>
