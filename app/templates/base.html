<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PestWatch{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>

<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a
                class="brand"
                href="{{ url_for('index') }}"
            >
                PestWatch
            </a>

            <nav
                class="main-nav"
                aria-label="Основная навигация"
            >
                <a
                    class="main-nav__link"
                    href="{{ url_for('index') }}"
                >
                    Оценка риска
                </a>

                <a
                    class="main-nav__link"
                    href="{{ url_for('threat_web.get_threat_catalog') }}"
                >
                    Каталог угроз
                </a>
            </nav>
        </div>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
